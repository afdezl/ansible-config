---
- name: Install bootstrap apt packages
  become: true
  ansible.builtin.apt:
    name: "{{ apt_base_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create working directories in home
  ansible.builtin.file:
    path: "{{ target_home }}/{{ item }}"
    state: directory
    mode: "0700"
  loop: "{{ home_dirs }}"
