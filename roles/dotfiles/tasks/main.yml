---
- name: Clone dotfiles repository
  ansible.builtin.git:
    repo: "{{ dotfiles_repo }}"
    dest: "{{ dotfiles_dir }}"
    update: false
    version: "{{ dotfiles_version }}"

- name: Ensure parent directories for links exist
  ansible.builtin.file:
    path: "{{ (target_home ~ '/' ~ item.dest) | dirname }}"
    state: directory
    mode: "0755"
  loop: "{{ dotfiles_links }}"
  loop_control:
    label: "{{ item.dest }}"

- name: Link dotfiles into home
  ansible.builtin.file:
    src: "{{ dotfiles_dir }}/{{ item.src }}"
    dest: "{{ target_home }}/{{ item.dest }}"
    state: link
    force: true
  loop: "{{ dotfiles_links }}"
  loop_control:
    label: "{{ item.dest }}"

- name: Render main gitconfig
  ansible.builtin.template:
    src: gitconfig.j2
    dest: "{{ target_home }}/.gitconfig"
    mode: "0644"

- name: Ensure vim-plug autoload directory exists
  ansible.builtin.file:
    path: "{{ target_home }}/.local/share/nvim/site/autoload"
    state: directory
    mode: "0755"

- name: Install vim-plug
  ansible.builtin.get_url:
    url: https://raw.githubusercontent.com/junegunn/vim-plug/master/plug.vim
    dest: "{{ target_home }}/.local/share/nvim/site/autoload/plug.vim"
    mode: "0644"
    force: false

- name: Install neovim plugins
  ansible.builtin.command:
    cmd: nvim --headless +PlugInstall +qa
    creates: "{{ target_home }}/.local/share/nvim/plugged/csv.vim"
  environment:
    HOME: "{{ target_home }}"
